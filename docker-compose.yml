version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: uonggia-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-uonggia_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD:  ${DB_PASSWORD:-your_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - uonggia-network
    restart: unless-stopped

  backend:
    build:
      context: ./BE
      dockerfile: Dockerfile
    container_name:  uonggia-backend
    environment:
      SPRING_DATASOURCE_URL:  jdbc:postgresql://postgres:5432/${DB_NAME:-uonggia_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD:  ${DB_PASSWORD:-your_password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET:  ${JWT_SECRET:-your_jwt_secret_key_change_in_production}
    ports: 
      - "8080:8080"
    depends_on: 
      - postgres
    networks: 
      - uonggia-network
    restart: unless-stopped

  frontend:
    build:
      context: ./FE
      dockerfile: Dockerfile
    container_name: uonggia-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - uonggia-network
    restart: unless-stopped

  admin: 
    build:
      context:  ./AdminFE/AdminFE
      dockerfile: Dockerfile
    container_name: uonggia-admin
    ports:
      - "81:81"
    depends_on: 
      - backend
    networks: 
      - uonggia-network
    restart: unless-stopped

volumes:
  postgres_data: 

networks:
  uonggia-network:
    driver: bridge